<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louvores Cifrados</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-title">Louvores Cifrados</div>
  </header>

  <main class="page">
    <section class="top-search-panel">
      <div class="search-wrap">
        <label class="search-label" for="searchInput">Buscar louvor</label>
        <input id="searchInput" type="text" placeholder="Digite número, título ou palavra do título" autocomplete="off" />
        <div id="suggestions" class="suggestions hidden"></div>
      </div>

      <div class="toolbar">
        <div class="db-switch">
          <button class="db-btn active" data-db="principal">Coletânea</button>
          <button class="db-btn" data-db="avulsos">Avulsos</button>
        </div>

        <div class="controls">
          <button id="toggleChordsBtn" class="control-btn">Ocultar cifras</button>
          <div class="font-controls">
            <button id="fontDownBtn" class="control-btn">A-</button>
            <button id="fontUpBtn" class="control-btn">A+</button>
          </div>
        </div>
      </div>

      <div id="resultInfo" class="result-info"></div>

      <div id="songList" class="song-list"></div>
    </section>

    <section class="reader-panel">
      <article class="song-reader">
        <h1 id="songTitle" class="song-title">Selecione um louvor</h1>
        <div id="songMeta" class="song-meta"></div>
        <div class="song-pre-wrap">
          <pre id="songContent" class="song-content"></pre>
        </div>
      </article>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
