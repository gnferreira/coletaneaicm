<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Louvores Cifrados</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>Louvores Cifrados</h1>
        <p>Banco para instrumentistas</p>
      </div>

      <div class="db-switch">
        <button id="btnPrincipal" class="db-btn active" type="button">Coletânea</button>
        <button id="btnAvulsos" class="db-btn" type="button">Louvores Avulsos</button>
      </div>

      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Buscar por número ou título" />
      </div>

      <div class="summary">
        <span id="countInfo">Carregando...</span>
      </div>

      <div id="songList" class="song-list"></div>
    </aside>

    <main class="viewer">
      <div class="viewer-header">
        <div>
          <div class="song-number" id="songNumero">---</div>
          <h2 id="songTitulo">Selecione um louvor</h2>
        </div>

        <div class="controls">
          <button id="decreaseFont" type="button">A-</button>
          <button id="increaseFont" type="button">A+</button>
          <button id="toggleChords" type="button">Ocultar cifras</button>
        </div>
      </div>

      <div class="pre-wrap">
        <pre id="songConteudo">Escolha um louvor na lista à esquerda.</pre>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
